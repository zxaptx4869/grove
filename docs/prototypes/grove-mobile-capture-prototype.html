            createdAt: '昨天 11:30', failReason: null, retryCount: 0, locked: false,
            ocr: '本次闭水自 9 月 20 日 10:00 开始，水位标记见图。\n9 月 21 日 10:00 复查：水位无明显下降，楼下顶面未见渗漏。',
            candidates: [
              { content: '闭水试验至少观察 24 小时并复查楼下顶面', path: '新房装修 / 施工 / 防水', reason: '来源记录了 24 小时前后的水位和楼下检查结果' },
            ],
            pollSteps: null, moving: false,
          },
          {
            id: 's5', kind: 'text', title: '插座预留位置备忘', attachments: [],
            note: '', text: '厨房台面插座中心距台面 300mm，冰箱和洗碗机各留一个独立回路。',
            projectId: 'p2', status: 'done', pending: 0, evidence: 3,
            createdAt: '9 月 20 日 15:20', failReason: null, retryCount: 0, locked: true,
            ocr: '', candidates: [], pollSteps: null, moving: false,
          },
          {
            id: 's6', kind: 'text', title: '验收群里提到的防水品牌', attachments: [],
            note: '', text: '群里说柔性防水更耐用，但没说是哪个型号。',
            projectId: null, status: 'failed', pending: 0, evidence: 0,
            createdAt: '9 月 20 日 09:05', failReason: '模型返回内容不符合候选结构，已尝试 2 次',
            retryCount: 2, locked: false, ocr: '', candidates: [], pollSteps: null, moving: false,
          },
        ]
      }

      /* ============================================================
         渲染：原型控制条 / 顶栏
         ============================================================ */
      function renderProtoBar() {
        $$('[data-list-state]').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.listState === state.listState)))
      }

      function renderHeader() {
        const leading = $('#headerLeading')
        const trailing = $('#headerTrailing')
        if (state.page === 'home') {
          $('#headerTitle').textContent = '收集'
          leading.innerHTML = '<span class="brand-mark" aria-hidden="true">G</span>'
          trailing.innerHTML = `<button type="button" class="header-icon" id="headerRefresh" data-refresh aria-label="刷新来源列表" title="刷新来源列表">${icon('refresh', 'width:21px;height:21px')}</button>`
          return
        }
        if (state.page === 'form') {
          $('#headerTitle').textContent = state.form ? state.form.title : '采集'
          leading.innerHTML = `<button type="button" class="header-icon" data-back-home aria-label="返回收集列表">${icon('arrow-left', 'width:22px;height:22px')}</button>`
          trailing.innerHTML = '<span></span>'
          return
        }
        $('#headerTitle').textContent = PERMISSIONS[state.permission]?.title || '权限'
        leading.innerHTML = `<button type="button" class="header-icon" data-permission-back aria-label="返回上一页">${icon('arrow-left', 'width:22px;height:22px')}</button>`
        trailing.innerHTML = '<span></span>'
      }

      function setPage(page) {
        state.page = page
        app.dataset.page = page
        $$('.screen').forEach(screen => screen.classList.toggle('active', screen.dataset.screen === page))
        if (page !== 'form') closeKeyboard()
        renderHeader()
      }

      /* ============================================================
         渲染：收集首页（入口 + 筛选 + 列表）
         ============================================================ */
      function countFor(filter) {
        return sources.filter(source => filter === 'all' || !source.projectId).length
      }
      function activeCount() {
        return sources.filter(source => source.status === 'waiting' || source.status === 'processing').length
      }

      function entryAreaHtml() {
        const entries = [
          { entry: 'camera', icon: 'camera', title: '相机' },
          { entry: 'album-choose', icon: 'images', title: '相册' },
          { entry: 'text', icon: 'type', title: '文本' },
        ]
        return `<div class="entry-row-b">${entries.map(item => `<button type="button" class="entry-tile" data-entry="${item.entry}">
            <span class="entry-icon">${icon(item.icon)}</span>
            <strong>${item.title}</strong>
          </button>`).join('')}</div>`
      }

      function filterAreaHtml() {
        const showCount = state.listState === 'normal'
        const segment = (value, label) => `<button type="button" class="seg" data-filter="${value}" aria-pressed="${state.filter === value}">
          ${state.filter === value ? icon('check') : ''}<span>${label}</span>${showCount ? `<span class="seg-count">${countFor(value)}</span>` : ''}
        </button>`
        return `<div class="filter-row" role="group" aria-label="来源筛选">${segment('all', '全部')}${segment('unassigned', '未归属')}</div>`
      }

      function statusBadgeHtml(source) {
        if (source.status === 'processing') return `<span class="badge processing"><span class="spinner"></span>处理中</span>`
        if (source.status === 'waiting') return `<span class="badge waiting">${icon('clock')}等待处理</span>`
        if (source.status === 'failed') return `<span class="badge failed">${icon('alert')}处理失败</span>`
        return `<span class="badge done">${icon('circle-check')}提取完成</span>`
      }

      function subStatusHtml(source) {
        if (source.status !== 'done') return ''
        if (source.pending > 0 && source.evidence === 0) return `<span class="tag tag-candidate">${icon('info')}待确认 ${source.pending} 条</span>`
        if (source.pending > 0 && source.evidence > 0) return `<span class="tag tag-candidate">${icon('info')}部分确认 · ${source.evidence} 条正式知识</span>`
        if (source.evidence > 0) return `<span class="tag tag-confirmed">${icon('circle-check')}${source.evidence} 条正式知识</span>`
        return `<span class="tag tag-unassigned">还没有候选</span>`
      }

      function sourceRowHtml(source) {
        const isText = source.kind === 'text'
        const attachmentText = isText ? '文字' : `${source.attachments.length} 张图片`
        const projectTag = source.projectId
          ? `<span class="tag tag-project">${icon('folder')}${escapeHtml(projectName(source.projectId))}</span>`
          : `<span class="tag tag-unassigned">${icon('info')}未归属</span>`
        const error = source.status === 'failed' && source.failReason
          ? `<p class="row-error">${icon('alert')}<span>${escapeHtml(source.failReason)}</span></p>` : ''
        const retry = source.status === 'failed'
          ? `<div class="row-actions"><button type="button" class="mini-button" data-retry="${source.id}">${icon('retry')}重试</button></div>` : ''
        const moving = source.moving ? `<span class="badge waiting"><span class="spinner"></span>正在重新路由</span>` : ''
        return `<li class="source-row" data-source="${source.id}">
          <button type="button" class="row-open" data-open-detail="${source.id}" aria-label="查看来源详情：${escapeHtml(source.title)}">
            <span class="row-icon">${icon(isText ? 'type' : 'image')}</span>
            <span class="row-main">
              <strong>${escapeHtml(source.title)}</strong>
              <span class="row-meta">${attachmentText} · ${escapeHtml(source.createdAt)}</span>
            </span>
            ${statusBadgeHtml(source)}
          </button>
          <div class="row-tags">${projectTag}${subStatusHtml(source)}${moving}</div>
          ${error}
          ${retry}
        </li>`
      }

      function emptyStateHtml() {
        return `<div class="state-card">
          <span class="state-mark">${icon('sprout')}</span>
          <h3>还没有来源</h3>
          <p>用上面的入口采集第一条材料。处理完成后，原始材料、OCR 文本和 AI 候选都会出现在来源详情里。</p>
          <button type="button" class="button primary" data-entry="album-choose">${icon('images')}从相册采集</button>
        </div>`
      }

      function failedStateHtml() {
        return `<div class="state-card is-error">
          <span class="state-mark">${icon('cloud-off')}</span>
          <h3>来源列表加载失败</h3>
          <p>网络连接不稳定，列表没有取到最新数据。已经提交的材料不会丢失，网络恢复后重新加载即可。</p>
          <button type="button" class="button" data-retry-load>${icon('retry')}重新加载</button>
        </div>`
      }

      function listAreaHtml() {
        if (state.listState === 'empty') return emptyStateHtml()
        if (state.listState === 'failed') return failedStateHtml()
        const rows = sources.filter(source => state.filter === 'all' || !source.projectId)
        if (!rows.length) return emptyStateHtml()
        return `<ul class="list-card">${rows.map(sourceRowHtml).join('')}</ul>`
      }

      function renderListMeta() {
        const meta = $('#listMeta')
        meta.classList.remove('tone-alert')
        if (state.refreshing) { meta.textContent = '刷新中…'; return }
        if (state.listState === 'failed') { meta.textContent = '加载失败'; meta.classList.add('tone-alert'); return }
        if (state.listState === 'empty') { meta.textContent = '0 条'; return }
        const active = activeCount()
        meta.textContent = active ? `${active} 条等待或处理中` : '下拉刷新'
      }

      function renderHome() {
        $('#entryArea').innerHTML = entryAreaHtml()
        $('#filterArea').innerHTML = filterAreaHtml()
        $('#listArea').innerHTML = listAreaHtml()
        renderListMeta()
        $('#pullLabel').textContent = '下拉刷新'
        $('#pullSpinner').hidden = true
      }

      /* ============================================================
         渲染：采集表单
         ============================================================ */
      function materialSectionHtml(form) {
        if (form.kind === 'text') {
          return `<div class="form-section">
            <div class="form-label"><strong>要收集的文字</strong><span class="optional" id="textCount">${form.text.length} 字</span></div>
            <textarea class="form-field" data-field="text" rows="7" inputmode="none" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="粘贴或输入要收集的文字">${escapeHtml(form.text)}</textarea>
            <div class="inline-actions">
              <button type="button" class="mini-button" data-clipboard>${icon('clipboard')}从剪贴板填入</button>
            </div>
          </div>`
        }
        if (form.kind !== 'text' && form.attachments.length > 1) {
          const count = form.attachments.length
          const merged = form.kind === 'album-merged'
          const thumbs = form.attachments.map((item, index) => `<span class="thumb">${photo(item.scene, item.label)}<button type="button" class="thumb-remove" data-remove-attachment="${index}" aria-label="移除第 ${index + 1} 张图片">${icon('trash')}</button></span>`).join('')
          const lead = merged ? `这 ${count} 张将作为一条材料一起整理` : `这 ${count} 张将分别作为 ${count} 条材料提交`
          const body = merged
            ? '候选与正式知识都关联同一条来源；需要每张各成一条时，请改走「每张一条」入口。'
            : '每张图片各成一条来源，可以分别改归属、删除或重试；需要合并成一条时，请改走「多张合并一条」入口。'
          return `<div class="form-section">
            <div class="form-label"><strong>原始材料</strong><span class="optional">共 ${count} 张</span></div>
            <div class="photo-strip">${thumbs}</div>
            <div class="info-banner merged" style="margin-top:10px">${icon('info')}<div><strong>${lead}</strong><p>${body}</p></div></div>
          </div>`
        }
        const item = form.attachments[0]
        if (!item) return ''
        const cameraTag = form.fromCamera ? `<span class="tag tag-project">${icon('camera')}来自系统相机</span>` : ''
        return `<div class="form-section">
          <div class="form-label"><strong>原始材料</strong><span class="optional">共 1 张</span></div>
          <div class="photo-lg">${photo(item.scene, item.label)}<button type="button" class="photo-remove" data-remove-attachment="0" disabled>${icon('trash')}移除这张</button></div>
          <div class="inline-actions">${cameraTag}<span class="caption muted">${escapeHtml(item.label)}</span></div>
          ${form.fromCamera ? '<p class="caption muted" style="margin-top:6px">系统相机一次拍摄一张；需要连续拍摄请返回后再次进入。</p>' : ''}
        </div>`
      }

      function protoPanelHtml() {
        return `<div class="proto-panel" role="group" aria-label="原型演示：模拟提交结果">
          <span class="proto-label">原型演示 · 模拟提交结果（正式实现不含此区域）</span>
          <div class="proto-chips">${SCENARIOS.map(item => `<button type="button" class="proto-chip" data-scenario="${item.id}" aria-pressed="${state.form.scenario === item.id}">${item.label}</button>`).join('')}</div>
          <p class="caption muted">选择分支后点「提交」，即可走通该结果。</p>
        </div>`
      }

      function errorCardHtml(message) {
        return `<div class="form-error" role="alert">
          <strong>${icon('alert')}提交未成功</strong>
          <p>${escapeHtml(message)}</p>
          <p class="proto-source">以上是服务端返回的原文，未做改写；材料没有保存到 Grove，调整后可以重新提交。</p>
        </div>`
      }

      function formBodyHtml(form) {
        return [
          materialSectionHtml(form),
          `<div class="form-section">
            <div class="form-label"><strong>补充说明</strong><span class="optional">可选</span></div>
            <textarea class="form-field form-note" data-field="note" rows="3" inputmode="none" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="这条材料还需要记点什么？">${escapeHtml(form.note)}</textarea>
          </div>`,
          `<div class="form-section">
            <div class="form-label"><strong>所属项目</strong><span class="optional">默认不归属</span></div>
            <button type="button" class="form-field field-row" data-open-project="form">
              <span class="field-value">${form.projectId ? iconClass('folder', 'is-project') + `<span>${escapeHtml(projectName(form.projectId))}</span>` : icon('info') + '<span>未归属</span>'}</span>
              ${icon('chevron')}
            </button>
          </div>`,
          form.error ? errorCardHtml(form.error) : '',
          protoPanelHtml(),
        ].join('')
      }

      function submitDisabled(form) {
        if (form.kind === 'text') return !form.text.trim()
        return form.attachments.length === 0
      }

      function formHint(form) {
        if (form.kind === 'text' && !form.text.trim()) return '先填入文字，再提交'
        if (form.kind !== 'text' && !form.attachments.length) return '至少保留 1 张图片'
        if (form.scenario !== 'success') {
          const label = SCENARIOS.find(item => item.id === form.scenario)?.label || ''
          return `原型演示：本次提交按「${label}」处理`
        }
        return '提交后可在「收集」列表里查看处理状态'
      }

      function renderForm() {
        const form = state.form
        if (!form) return
        $('#formArea').innerHTML = formBodyHtml(form)
        $('#formHint').textContent = formHint(form)
        $('#submitButton').disabled = submitDisabled(form)
      }

      /* ============================================================
         渲染：权限被拒
         ============================================================ */
      function renderPermission() {
        if (state.page !== 'permission' || !state.permission) return
        const config = PERMISSIONS[state.permission]
        $('#permissionArea').innerHTML = `
          <div class="permission-card">
            <span class="state-mark">${icon(config.icon)}</span>
            <h2>${config.heading}</h2>
            <p>${config.purpose}</p>
            <ul>${config.bullets.map(text => `<li>${text}</li>`).join('')}</ul>
          </div>
          <div class="notice" style="margin-top:14px">
            <strong>${icon('lock')}需要你在系统设置里开启</strong>
            <p>${config.note}</p>
          </div>
          <div style="display:grid;gap:8px;margin-top:14px">
            <button type="button" class="button primary block" data-open-settings>去设置</button>
            <button type="button" class="button ghost block" data-permission-back>${config.returnLabel}</button>
          </div>`
      }

      /* ============================================================
         渲染：来源详情（候选只读）
         ============================================================ */
      function candidateEmptyText(source) {
        if (source.status === 'failed') return '处理失败，还没有候选。可以在列表里重试处理。'
        if (source.status === 'waiting' || source.status === 'processing') return '材料还在处理中，候选会在这里出现。'
        if (source.evidence > 0) return `该来源的候选都已经在桌面工作台处理完成；现在有 ${source.evidence} 条正式知识引用它。`
        return '这条来源还没有候选。'
      }

      function renderDetail() {
        const source = sources.find(item => item.id === state.detailId)
        if (!source) return
        const isText = source.kind === 'text'
        const material = isText
          ? `<div class="text-quote">${escapeHtml(source.text)}</div>`
          : `<div class="photo-grid">${source.attachments.map((item, index) => `<button type="button" class="photo-button" data-zoom="${index}" aria-label="放大查看第 ${index + 1} 张：${escapeHtml(item.label)}">${photo(item.scene, item.label)}<span class="zoom-hint">${icon('zoom')}放大</span></button>`).join('')}</div>`
        const ocr = source.ocr
          ? `<div class="ocr-block">${escapeHtml(source.ocr)}</div><p class="detail-hint">机器识别结果，可能与原图存在差异；正式知识以人工确认为准。</p>`
          : `<p class="detail-hint">${isText ? '文字来源不需要 OCR 识别。' : source.status === 'failed' ? '本次处理没有产生 OCR 文本。' : '视频材料还在处理中，还没有 OCR 文本。'}</p>`
        const candidates = source.candidates.length
          ? source.candidates.map(item => `<article class="candidate-card">
              <div class="candidate-tags"><span class="badge candidate">${icon('info')}AI 候选</span><span class="badge neutral">未应用</span></div>
              <h4>${escapeHtml(item.content)}</h4>
              <p class="candidate-line"><b>目录建议：</b>${escapeHtml(item.path)}</p>
              <p class="candidate-line"><b>理由：</b>${escapeHtml(item.reason)}</p>
            </article>`).join('')
          : `<p class="detail-hint">${candidateEmptyText(source)}</p>`
        const projectValue = source.projectId
          ? `${escapeHtml(projectName(source.projectId))}${source.locked ? '<br />已被正式知识引用，不能改归属或删除' : ''}`
          : '未归属'
        $('#detailArea').innerHTML = `
          <div class="detail-card">
            <div class="detail-tags">${statusBadgeHtml(source)}${subStatusHtml(source)}</div>
            <h2 class="detail-title">${escapeHtml(source.title)}</h2>
            <dl class="detail-meta">
              <dt>类型</dt><dd>${isText ? '文字' : `图片 · ${source.attachments.length} 张`}</dd>
              <dt>创建时间</dt><dd>${escapeHtml(source.createdAt)}</dd>
              <dt>项目归属</dt><dd>${projectValue}</dd>
              <dt>补充说明</dt><dd>${source.note ? escapeHtml(source.note) : '未填写'}</dd>
            </dl>
          </div>
          ${source.status === 'failed' && source.failReason ? `<div class="notice is-error" style="margin-top:14px"><strong>${icon('alert')}处理失败</strong><p>${escapeHtml(source.failReason)}</p><p>可以在列表里对这条来源重试处理。</p></div>` : ''}
          <section class="detail-block">
            <h3>原始材料<span>${isText ? '文字正文' : `${source.attachments.length} 张图片`}</span></h3>
            ${material}
          </section>
          <section class="detail-block">
            <h3>OCR 文本<span>只读</span></h3>
            ${ocr}
          </section>
          <section class="detail-block">
            <h3>AI 候选<span>共 ${source.candidates.length} 条 · 未应用</span></h3>
            ${candidates}
          </section>`
        $('#detailFooter').innerHTML = `
          <button type="button" class="button" data-move="${source.id}"${source.moving ? ' disabled' : ''}>${icon('move')}改归属</button>
          <button type="button" class="button danger" data-delete="${source.id}">${icon('trash')}删除</button>`
      }

      /* ============================================================
         渲染：放大查看
         ============================================================ */
      function renderLightbox() {
        if (!state.lightbox) return
        const source = sources.find(item => item.id === state.lightbox.sourceId)
        if (!source) return
        const index = state.lightbox.index
        const item = source.attachments[index]
        const total = source.attachments.length
        $('#lightboxTitle').textContent = `第 ${index + 1} / ${total} 张`
        $('#lightboxArea').innerHTML = `
          <div class="lightbox-frame">${photo(item.scene, item.label)}</div>
          <p class="lightbox-caption">${escapeHtml(item.label)}<br />原型用线稿示意图代替真实照片，放大只演示交互。</p>
          ${total > 1 ? `<div class="lightbox-pager">
            <button type="button" data-lightbox-step="-1">上一张</button>
            <span>第 ${index + 1} / ${total} 张</span>
            <button type="button" data-lightbox-step="1">下一张</button>
          </div>` : ''}`
      }

      /* ============================================================
         渲染：提交状态
         ============================================================ */
      function renderSubmitOverlay() {
        if (!state.submitPhase) return
        const area = $('#submitArea')
        const form = state.form
        const count = form ? form.attachments.length : 0
        const materialText = form && form.kind === 'text' ? '文字' : `${count} 张图片`
        const projectText = form && form.projectId ? projectName(form.projectId) : '未归属'
        if (state.submitPhase === 'uploading') {
          $('#submitTitle').textContent = '提交材料'
          area.innerHTML = `<div class="status-card">
            <span class="status-mark"><span class="spinner lg"></span></span>
            <h2>${form && form.kind === 'text' ? '正在提交文字来源…' : `正在上传 ${count} 张图片…`}</h2>
            <p>请保持 Grove 在前台。上传结束前不要重复提交，重复提交不会生成第二条来源。</p>
            <div class="status-facts">
              <span>材料：${materialText}</span>
              <span>所属项目：${projectText}</span>
            </div>
          </div>`
          return
        }
        if (state.submitPhase === 'upload-failed') {
          $('#submitTitle').textContent = '提交未成功'
          area.innerHTML = `<div class="status-card">
            <span class="status-mark error">${icon('cloud-off')}</span>
            <h2>提交未成功</h2>
            <p>网络连接中断，材料没有保存到 Grove。已经填好的内容还在表单里。</p>
            <div class="status-facts"><span>重试会继续使用同一次采集，不会生成重复来源。</span></div>
            <div class="status-actions">
              <button type="button" class="button primary block" data-submit-retry>重试提交</button>
              <button type="button" class="button ghost block" data-back-to-form>返回表单</button>
            </div>
          </div>`
          return
        }
        const source = sources.find(item => item.id === state.submitSourceId)
        $('#submitTitle').textContent = '处理启动失败'
        area.innerHTML = `<div class="status-card">
          <span class="status-mark warn">${icon('alert')}</span>
          <h2>来源已保存，但处理启动失败</h2>
          <p>材料已经进入「收集」列表，但还没有开始处理。</p>
          <div class="status-facts">
            <span>列表状态：处理失败（处理未启动）</span>
            <span>可以随时重试处理，不需要重新采集一次。</span>
          </div>
          <div class="status-actions">
            <button type="button" class="button primary block" data-retry="${source ? source.id : ''}">重试处理</button>
            ${source ? `<button type="button" class="button block" data-open-detail="${source.id}">查看来源</button>` : ''}
            <button type="button" class="button ghost block" data-back-home>返回收集</button>
          </div>
        </div>`
      }

      /* ============================================================
         渲染：改归属 / 删除 Sheet
         ============================================================ */
      function moveBlockedReason(source) {
        if (source.locked) {
          return { title: '不能修改归属', detail: '该来源已被正式知识引用，如需移动请先处理关联 Entry', hint: '请先在桌面工作台处理关联的正式知识，再回到这里改归属。' }
        }
        if (source.status === 'processing') {
          return { title: '不能修改归属', detail: '来源正在处理中，不能修改归属', hint: '等处理结束后再修改归属。' }
        }
        return null
      }

      function deleteBlockedReason(source) {
        if (source.locked) {
          return { title: '不能删除', detail: '该来源已被正式知识引用，不能删除；请先处理关联 Entry', hint: '请先在桌面工作台处理关联的正式知识。' }
        }
        if (source.status === 'processing') {
          return { title: '不能删除', detail: '来源正在处理中，不能删除', hint: '等处理结束后再删除。' }
        }
        return null
      }

      function renderProjectSheet() {
        const config = state.projectSheet
        if (!config) return
        const source = config.sourceId ? sources.find(item => item.id === config.sourceId) : null
        const currentId = config.mode === 'form' ? (state.form ? state.form.projectId : null) : source.projectId
        const blocked = source ? moveBlockedReason(source) : null
        $('#projectSheetTitle').textContent = config.mode === 'form' ? '所属项目' : '修改归属'
        const notice = blocked
          ? `<div class="notice"><strong>${icon('lock')}${blocked.title}</strong><p>${escapeHtml(blocked.detail)}</p><p>${blocked.hint}</p></div>` : ''
        const intro = source ? `<p class="caption muted" style="margin-bottom:6px">${escapeHtml(source.title)}</p>` : ''
        const options = [{ id: null, name: '未归属', caption: '暂不归属任何项目' }, ...PROJECTS].map(item => {
          const checked = item.id === currentId
          return `<button type="button" class="option-row" role="radio" aria-checked="${checked}" data-pick-project="${item.id ?? ''}"${blocked ? ' aria-disabled="true"' : ''}>
            <span class="row-icon">${icon(item.id ? 'folder' : 'info')}</span>
            <span><strong>${escapeHtml(item.name)}</strong><span>${item.caption}</span></span>
            <svg class="icon option-check" aria-hidden="true"><use href="#i-check"/></svg>
          </button>`
        }).join('')
        const sheetBody = $('#projectSheetBody')
        sheetBody.dataset.mode = config.mode
        sheetBody.dataset.sheetSource = config.sourceId || ''
        sheetBody.innerHTML = `${notice}${intro}<div role="radiogroup" aria-label="选择所属项目">${options}</div>
          <div class="sheet-actions single"><button type="button" class="button" data-close-sheet>${blocked ? '知道了' : '取消'}</button></div>`
      }

      function renderDeleteSheet() {
        const source = sources.find(item => item.id === state.deleteTargetId)
        if (!source) return
        const blocked = deleteBlockedReason(source)
        if (blocked) {
          $('#deleteSheetBody').innerHTML = `<div class="notice is-error"><strong>${icon('lock')}${blocked.title}</strong><p>${escapeHtml(blocked.detail)}</p><p>${blocked.hint}</p></div>
            <div class="sheet-actions single"><button type="button" class="button" data-close-sheet>知道了</button></div>`
          return
        }
        const detail = source.pending > 0
          ? `<p>「${escapeHtml(source.title)}」有 ${source.pending} 条待确认候选，删除将一并移除这些候选。确认删除？</p>`
          : `<p>删除后这条来源的原始材料与已经生成的候选都会移除，无法恢复。</p>`
        $('#deleteSheetBody').innerHTML = `<div class="confirm-box"><strong>删除「${escapeHtml(source.title)}」？</strong>${detail}</div>
          <div class="sheet-actions">
            <button type="button" class="button" data-close-sheet>取消</button>
            <button type="button" class="button danger" data-confirm-delete="${source.id}">确认删除</button>
          </div>`
      }

      /* ============================================================
         总渲染
         ============================================================ */
      function render() {
        renderProtoBar()
        renderHeader()
        renderHome()
        if (state.form) renderForm()
        renderPermission()
        if (state.detailId) renderDetail()
        if (state.lightbox) renderLightbox()
        if (state.projectSheet) renderProjectSheet()
        if (state.deleteTargetId) renderDeleteSheet()
        renderSubmitOverlay()
      }

      /* ============================================================
         层管理：Sheet / Overlay / 键盘
         ============================================================ */
      const focusableSelector = 'button:not([disabled]):not([tabindex="-1"]), input:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'

      function topOverlay() {
        return overlayStack.length ? overlayStack[overlayStack.length - 1].el : null
      }

      function syncLayerIsolation() {
        const sheet = $$('.sheet.open').pop()
        const overlay = topOverlay()
        $$('.app > .proto-bar, .app > .app-header, .app > .screens, .app > .bottom-nav, .app > .demo-keyboard').forEach(element => {
          element.inert = Boolean(sheet || overlay)
        })
        $$('.overlay').forEach(element => { element.inert = Boolean(sheet || (overlay && element !== overlay)) })
        $$('.sheet').forEach(element => { element.inert = Boolean(sheet && element !== sheet) })
      }

      function restoreFocus(trigger) {
        if (trigger && trigger.isConnected && !trigger.closest('[inert]')) trigger.focus({ preventScroll: true })
      }

      function closeSheets({ restore = true } = {}) {
        $$('.sheet.open').forEach(sheet => sheet.classList.remove('open'))
        scrim.classList.remove('open')
        state.projectSheet = null
        state.deleteTargetId = null
        syncLayerIsolation()
        if (restore) restoreFocus(sheetTrigger)
        sheetTrigger = null
      }

      function openSheet(name) {
        const trigger = document.activeElement
        closeSheets({ restore: false })
        closeKeyboard()
        const sheet = document.getElementById(`${name}Sheet`)
        if (!sheet) return
        sheetTrigger = trigger
        scrim.classList.add('open')
        sheet.classList.add('open')
        syncLayerIsolation()
        sheet.querySelector('button')?.focus({ preventScroll: true })
      }

      function openOverlay(name) {
        const overlay = document.getElementById(`${name}Overlay`)
        if (!overlay || overlayStack.some(item => item.name === name)) return
        const trigger = document.activeElement
        closeKeyboard()
        overlay.classList.add('open')
        overlayStack.push({ name, el: overlay, trigger })
        syncLayerIsolation()
        overlay.querySelector(focusableSelector)?.focus({ preventScroll: true })
      }

      function closeOverlay(name) {
        const index = name ? overlayStack.findIndex(item => item.name === name) : overlayStack.length - 1
        if (index < 0) return
        const [entry] = overlayStack.splice(index, 1)
        entry.el.classList.remove('open')
        if (entry.name === 'detail') state.detailId = null
        if (entry.name === 'lightbox') state.lightbox = null
        if (entry.name === 'submit') { state.submitPhase = null; state.submitSourceId = null; state.submitting = false }
        syncLayerIsolation()
        restoreFocus(entry.trigger)
      }

      function closeAllOverlays() {
        while (overlayStack.length) closeOverlay()
      }

      function openKeyboard(field) {
        state.activeField = field
        $('#keyboardTarget').textContent = field.dataset.field === 'note' ? '补充说明' : '要收集的文字'
        clearTimeout(keyboardTimer)
        keyboardTimer = setTimeout(() => {
          if (document.activeElement === field) app.classList.add('keyboard-open')
        }, 80)
      }

      function closeKeyboard() {
        clearTimeout(keyboardTimer)
        app.classList.remove('keyboard-open')
        state.activeField = null
      }

      function showToast(message) {
        toastEl.textContent = message
        toastEl.classList.add('show')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400)
      }

      /* ============================================================
         采集：打开表单与入口
         ============================================================ */
      function openForm(kind) {
        const preset = ENTRY_PRESETS[kind] || { attachments: [], toast: '' }
        state.form = {
          kind,
          title: FORM_TITLES[kind] || '采集',
          fromCamera: kind === 'camera',
          attachments: clone(preset.attachments),
          note: '',
          text: '',
          projectId: null,
          scenario: 'success',
          error: null,
        }
        closeAllOverlays()
        setPage('form')
        renderForm()
        $('#formScroll').scrollTop = 0
        if (preset.toast) showToast(preset.toast)
      }

      function backHome() {
        state.form = null
        state.permission = null
        closeKeyboard()
        setPage('home')
        render()
      }

      function openPermission(kind) {
        state.previousPage = state.page === 'permission' ? state.previousPage : state.page
        state.permission = kind
        closeAllOverlays()
        setPage('permission')
        renderPermission()
        $('#permissionScroll').scrollTop = 0
      }

      /* ============================================================
         提交
         ============================================================ */
      function applyScenario(id) {
        const form = state.form
        if (!form) return
        form.scenario = id
        form.error = null
        if (id === '400-limit') {
          form.kind = 'album-merged'
          form.title = '图片采集'
          form.fromCamera = false
          form.attachments = [
            { scene: 'wall', label: '墙面涂刷范围' },
            { scene: 'pipe', label: '管根加强层' },
            { scene: 'water', label: '闭水水位标记' },
            { scene: 'note', label: '现场记录' },
            { scene: 'wall', label: '门槛石内侧' },
            { scene: 'pipe', label: '地漏周边' },
          ]
        }
        if (id === '400-size') {
          form.kind = 'album-separate'
          form.title = '图片采集'
          form.fromCamera = false
          form.attachments = [{ scene: 'water', label: '闭水水位原图.jpg · 12.4MB' }]
        }
        if (id === '400-format') {
          form.kind = 'album-separate'
          form.title = '图片采集'
          form.fromCamera = false
          form.attachments = [{ scene: 'note', label: '验收记录.heic' }]
        }
        if (id === 'success' || id === 'upload-failed' || id === 'process-failed') {
          if (form.attachments.length === 0 && form.kind !== 'text') {
            form.kind = 'album-separate'
            form.title = '图片采集'
            form.attachments = clone(ENTRY_PRESETS['album-separate'].attachments)
          }
        }
        renderForm()
        showToast(`已切换到「${SCENARIOS.find(item => item.id === id)?.label}」演示分支`)
      }

      function newSourceFromForm(outcome, index = 0) {
        const form = state.form
        const isText = form.kind === 'text'
        const separate = form.kind === 'album-separate' && form.attachments.length > 1
        const picked = separate ? [form.attachments[index]] : form.attachments
        const firstLine = isText ? (form.text.split('\n').map(line => line.trim()).find(Boolean) || '未命名文字').slice(0, 120) : ''
        const title = isText
          ? firstLine
          : separate
            ? picked[0].label
            : form.attachments.length > 1 ? `${form.attachments.length} 张现场照片` : '现场照片'
        const createdAt = '刚刚'
        const base = {
          id: `new-${Date.now()}-${index}`,
          kind: isText ? 'text' : 'image',
          title,
          attachments: clone(picked),
          note: form.note.trim(),
          text: form.text,
          projectId: form.projectId,
          status: outcome === 'process-failed' ? 'failed' : 'waiting',
          pending: 0,
          evidence: 0,
          createdAt,
          failReason: outcome === 'process-failed' ? '处理未启动，可重试' : null,
          retryCount: 0,
          locked: false,
          ocr: '',
          candidates: [],
          moving: false,
          pollSteps: outcome === 'process-failed' ? null : [
            { patch: { status: 'processing' }, note: `「${title}」开始处理` },
            {
              patch: {
                status: 'done',
                pending: 2,
                ocr: '识别到 2 处与施工顺序相关的文字说明。',
                candidates: [
                  { content: '管根加强层应在大面涂刷前完成', path: '新房装修 / 施工 / 防水', reason: '来源图片显示了加强层与大面涂刷的先后顺序' },
                  { content: '补刷完成后需要留出干燥时间', path: '新房装修 / 施工 / 工序衔接', reason: '来源记录提到补刷，但缺少干燥时间' },
                ],
              },
              note: `「${title}」处理完成，新增 2 条待确认候选`,
            },
          ],
        }
        return base
      }

      function newSourcesFromForm(outcome) {
        const form = state.form
        const count = form.kind === 'album-separate' ? Math.max(1, form.attachments.length) : 1
        return Array.from({ length: count }, (_, index) => newSourceFromForm(outcome, index))
      }

      async function submitForm() {
        const form = state.form
        if (!form || state.submitting || submitDisabled(form)) return
        state.submitting = true
        form.error = null
        state.submitPhase = 'uploading'
        openOverlay('submit')
        renderSubmitOverlay()
        await wait(1200)
        const scenario = form.scenario
        if (scenario === 'upload-failed') {
          state.submitting = false
          state.submitPhase = 'upload-failed'
          renderSubmitOverlay()
          return
        }
        if (FORMAT_MESSAGES[scenario]) {
          state.submitting = false
          state.submitPhase = null
          closeOverlay('submit')
          form.error = FORMAT_MESSAGES[scenario]
          renderForm()
          $('#formScroll').scrollTop = $('#formScroll').scrollHeight
          showToast('服务端拒绝了这次提交，材料没有保存')
          return
        }
        if (scenario === 'process-failed') {
          const created = newSourcesFromForm('process-failed')
          sources.unshift(...created)
          state.submitSourceId = created[0].id
          state.submitting = false
          state.submitPhase = 'process-failed'
          state.listState = 'normal'
          render()
          return
        }
        const created = newSourcesFromForm('success')
        sources.unshift(...created)
        state.submitting = false
        state.submitPhase = null
        closeOverlay('submit')
        state.listState = 'normal'
        state.form = null
        setPage('home')
        render()
        $('#homeScroll').scrollTop = 0
        showToast(created.length > 1
          ? `已提交，${created.length} 张图片分别生成了 ${created.length} 条采集`
          : '已提交，材料已进入收集列表')
      }

      async function retrySubmit() {
        if (state.submitting) return
        state.submitting = true
        state.submitPhase = 'uploading'
        renderSubmitOverlay()
        await wait(1100)
        const created = newSourcesFromForm('success')
        sources.unshift(...created)
        state.submitting = false
        state.submitPhase = null
        closeOverlay('submit')
        state.listState = 'normal'
        state.form = null
        setPage('home')
        render()
        $('#homeScroll').scrollTop = 0
        showToast(created.length > 1
          ? `重试成功：沿用同一次采集，没有生成重复采集（共 ${created.length} 条）`
          : '重试成功：沿用同一次采集，没有生成重复来源')
      }

      /* ============================================================
         列表操作：改归属 / 重试 / 删除
         ============================================================ */
      async function moveSource(id, projectId) {
        const source = sources.find(item => item.id === id)
        if (!source) return
        closeSheets()
        source.moving = true
        render()
        await wait(1200)
        source.moving = false
        source.projectId = projectId
        if (!projectId) {
          render()
          showToast('已改为未归属')
          return
        }
        render()
        showToast(state.filter === 'unassigned'
          ? `归属已更新为「${projectName(projectId)}」，已从「未归属」筛选中移出`
          : `归属已更新为「${projectName(projectId)}」`)
      }

      async function retrySource(id) {
        const source = sources.find(item => item.id === id)
        if (!source) return
        source.status = 'processing'
        source.failReason = null
        render()
        showToast(`已重新开始处理「${source.title}」`)
        await wait(2000)
        source.status = 'done'
        source.pending = 2
        source.evidence = 0
        source.ocr = '识别到 2 处与施工顺序相关的文字说明。'
        source.candidates = [
          { content: '管根加强层应在大面涂刷前完成', path: '新房装修 / 施工 / 防水', reason: '来源图片显示了加强层与大面涂刷的先后顺序' },
          { content: '补刷完成后需要留出干燥时间', path: '新房装修 / 施工 / 工序衔接', reason: '来源记录提到补刷，但缺少干燥时间' },
        ]
        render()
        showToast(`「${source.title}」处理完成，新增 2 条待确认候选`)
      }

      function confirmDelete(id) {
        const index = sources.findIndex(item => item.id === id)
        if (index < 0) return
        const [removed] = sources.splice(index, 1)
        closeSheets()
        closeOverlay('detail')
        render()
        showToast(`已删除「${removed.title}」`)
      }

      /* ============================================================
         前台刷新（下拉刷新 / 顶栏刷新）
         ============================================================ */
      function pollTick() {
        const notes = []
        sources.forEach(source => {
          if (!source.pollSteps || !source.pollSteps.length) return
          const step = source.pollSteps.shift()
          Object.assign(source, step.patch)
          notes.push(step.note)
        })
        return notes
      }

      async function refreshList({ fromPull = false } = {}) {
        if (state.refreshing || state.page !== 'home') return
        if (state.listState === 'failed') {
          state.listState = 'normal'
          render()
          showToast('已重新加载来源列表')
          return
        }
        state.refreshing = true
        const wrap = $('#pullWrap')
        if (fromPull) {
          wrap.classList.add('dragging')
          wrap.style.transform = 'translateY(48px)'
        }
        $('#pullSpinner').hidden = false
        $('#pullLabel').textContent = '刷新中…'
        renderListMeta()
        $('#headerRefresh')?.classList.add('spinning')
        await wait(900)
        const notes = pollTick()
        state.refreshing = false
        wrap.classList.remove('dragging')
        wrap.style.transform = ''
        $('#pullSpinner').hidden = true
        $('#pullLabel').textContent = '下拉刷新'
        $('#headerRefresh')?.classList.remove('spinning')
        render()
        if (notes.length) showToast(notes.join('；'))
        else showToast(activeCount() ? `已刷新，${activeCount()} 条仍在处理中` : '已刷新，没有新的来源')
      }

      function setPull(distance) {
        const wrap = $('#pullWrap')
        wrap.style.transform = distance ? `translateY(${distance}px)` : ''
        $('#pullLabel').textContent = distance >= PULL_THRESHOLD ? '松开刷新' : '下拉刷新'
      }

      let pullStartY = null
      let pullDistance = 0
      let pulling = false

      function startPull(clientY) {
        const homeScroll = $('#homeScroll')
        if (state.page !== 'home' || state.refreshing || homeScroll.scrollTop > 0) return
        pullStartY = clientY
        pullDistance = 0
        pulling = true
        $('#pullWrap').classList.add('dragging')
      }

      function movePull(clientY) {
        if (!pulling) return
        const delta = clientY - pullStartY
        if (delta <= 0) { setPull(0); return }
        pullDistance = Math.min(96, delta * 0.55)
        setPull(pullDistance)
      }

      async function endPull() {
        if (!pulling) return
        pulling = false
        $('#pullWrap').classList.remove('dragging')
        if (pullDistance >= PULL_THRESHOLD) {
          await refreshList({ fromPull: true })
        } else {
          setPull(0)
        }
        pullDistance = 0
        pullStartY = null
      }

      /* ============================================================
         事件：点击
         ============================================================ */
      app.addEventListener('click', async (event) => {
        const target = event.target.closest('button, [data-close-sheet]')
        if (!target) return

        if (target.dataset.listState) { state.listState = target.dataset.listState; renderHome(); return }
        if (target.dataset.permission) { openPermission(target.dataset.permission); return }
        if (target.hasAttribute('data-reset')) { resetPrototype(); return }
        if (target.dataset.scenario) { applyScenario(target.dataset.scenario); return }
        if (target.dataset.otherTab) {
          if (target.dataset.otherTab !== '收集') showToast('本原型只覆盖「收集」模块，其余三栏保持静态')
          return
        }

        if (target.dataset.entry) {
          const entry = target.dataset.entry
          closeSheets({ restore: false })
          if (entry === 'album-choose') { openSheet('album'); return }
          openForm(entry)
          return
        }

        if (target.dataset.refresh !== undefined) { refreshList(); return }
        if (target.hasAttribute('data-retry-load')) { state.listState = 'normal'; render(); showToast('已重新加载来源列表'); return }
        if (target.dataset.filter) { state.filter = target.dataset.filter; renderHome(); return }
        if (target.dataset.openDetail) {
          if (state.submitPhase) closeOverlay('submit')
          openDetail(target.dataset.openDetail)
          return
        }
        if (target.dataset.move) { openMoveSheet(target.dataset.move); return }
        if (target.dataset.delete) { state.deleteTargetId = target.dataset.delete; renderDeleteSheet(); openSheet('delete'); return }
        if (target.dataset.confirmDelete) { confirmDelete(target.dataset.confirmDelete); return }
        if (target.dataset.retry) {
          closeAllOverlays()
          retrySource(target.dataset.retry)
          return
        }

        if (target.dataset.openProject) { state.projectSheet = { mode: 'form', sourceId: null }; renderProjectSheet(); openSheet('project'); return }
        if (target.dataset.pickProject !== undefined) {
          if (target.getAttribute('aria-disabled') === 'true') return
          const sheetBody = $('#projectSheetBody')
          const projectId = target.dataset.pickProject || null
          if (sheetBody.dataset.mode === 'form') {
            if (state.form) state.form.projectId = projectId
            closeSheets()
            renderForm()
            showToast(projectId ? `所属项目已设为「${projectName(projectId)}」` : '已设为未归属')
            return
          }
          if (sheetBody.dataset.sheetSource) await moveSource(sheetBody.dataset.sheetSource, projectId)
          return
        }
        if (target.hasAttribute('data-clipboard')) {
          const sample = '监理提醒：门槛石内侧防水要在门套安装前完成；补刷后保持 24 小时不沾水，再进入下一道工序。'
          const field = $('[data-field="text"]')
          if (field && state.form) {
            state.form.text = sample
            field.value = sample
            $('#textCount').textContent = `${sample.length} 字`
            $('#submitButton').disabled = submitDisabled(state.form)
            $('#formHint').textContent = formHint(state.form)
          }
          showToast('已从剪贴板填入示例文字')
          return
        }
        if (target.dataset.removeAttachment !== undefined) {
          const form = state.form
          if (!form) return
          const index = Number(target.dataset.removeAttachment)
          if (form.attachments.length <= 1) return
          form.attachments.splice(index, 1)
          renderForm()
          showToast('已移除 1 张，剩余 ' + form.attachments.length + ' 张')
          return
        }
        if (target.hasAttribute('data-submit')) { submitForm(); return }
        if (target.hasAttribute('data-submit-retry')) { retrySubmit(); return }
        if (target.hasAttribute('data-back-to-form')) { closeOverlay('submit'); state.submitting = false; renderForm(); return }
        if (target.hasAttribute('data-back-home')) { closeSheets({ restore: false }); closeAllOverlays(); backHome(); return }
        if (target.hasAttribute('data-permission-back')) {
          const backTo = state.previousPage === 'permission' ? 'home' : state.previousPage
          state.permission = null
          setPage(backTo)
          if (backTo === 'form' && state.form) renderForm()
          render()
          return
        }
        if (target.hasAttribute('data-open-settings')) {
          showToast('原型不跳转系统设置；正式实现会直接打开 Grove 的系统设置页')
          return
        }

        if (target.dataset.zoom !== undefined) {
          const index = Number(target.dataset.zoom)
          state.lightbox = { sourceId: state.detailId, index }
          renderLightbox()
          openOverlay('lightbox')
          return
        }
        if (target.dataset.lightboxStep) {
          const source = sources.find(item => item.id === state.lightbox.sourceId)
          if (!source) return
          const total = source.attachments.length
          const step = Number(target.dataset.lightboxStep)
          state.lightbox.index = (state.lightbox.index + step + total) % total
          renderLightbox()
          return
        }
        if (target.dataset.closeOverlay) { closeOverlay(target.dataset.closeOverlay); return }
        if (target.hasAttribute('data-close-sheet')) { closeSheets(); return }

        if (target.dataset.key !== undefined) { insertKey(target.dataset.key); return }
        if (target.hasAttribute('data-keyboard-backspace')) { backspaceKey(); return }
        if (target.hasAttribute('data-keyboard-shift')) { showToast('原型键盘只做小写输入示意'); return }
        if (target.hasAttribute('data-keyboard-dismiss')) { state.activeField?.blur(); closeKeyboard(); return }
      })

      function openDetail(id) {
        state.detailId = id
        renderDetail()
        openOverlay('detail')
      }

      function openMoveSheet(id) {
        state.projectSheet = { mode: 'move', sourceId: id }
        renderProjectSheet()
        openSheet('project')
      }

      /* ============================================================
         事件：输入与模拟键盘
         ============================================================ */
      function insertKey(text) {
        const field = state.activeField
        if (!field) return
        const start = field.selectionStart ?? field.value.length
        const end = field.selectionEnd ?? start
        field.setRangeText(text, start, end, 'end')
        field.dispatchEvent(new Event('input', { bubbles: true }))
      }

      function backspaceKey() {
        const field = state.activeField
        if (!field) return
        const start = field.selectionStart ?? 0
        const end = field.selectionEnd ?? 0
        if (start !== end) field.setRangeText('', start, end, 'end')
        else if (start > 0) field.setRangeText('', start - 1, start, 'end')
        field.dispatchEvent(new Event('input', { bubbles: true }))
      }

      function scrollFieldIntoView(field) {
        const scroller = field.closest('.scroll-page')
        if (!scroller) return
        const top = field.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop
        scroller.scrollTo({ top: Math.max(0, top - 28), behavior: 'smooth' })
      }

      app.addEventListener('focusin', (event) => {
        const field = event.target.closest('[data-field]')
        if (!field) return
        openKeyboard(field)
        setTimeout(() => { if (document.activeElement === field) scrollFieldIntoView(field) }, 220)
      })

      app.addEventListener('focusout', (event) => {
        const field = event.target.closest('[data-field]')
        if (!field) return
        clearTimeout(keyboardTimer)
        setTimeout(() => {
          if (!document.activeElement || !document.activeElement.closest('[data-field]')) closeKeyboard()
        }, 120)
      })

      app.addEventListener('input', (event) => {
        const field = event.target.closest('[data-field]')
        if (!field || !state.form) return
        const key = field.dataset.field
        state.form[key] = field.value
        if (key === 'text') {
          const counter = $('#textCount')
          if (counter) counter.textContent = `${field.value.length} 字`
          const submit = $('#submitButton')
          if (submit) submit.disabled = submitDisabled(state.form)
          const hint = $('#formHint')
          if (hint) hint.textContent = formHint(state.form)
        }
      })

      $('#demoKeyboard').addEventListener('pointerdown', (event) => event.preventDefault())
      document.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.demo-keyboard') || event.target.closest('[data-field]')) return
        if (state.activeField) { state.activeField.blur(); closeKeyboard() }
      })

      /* ============================================================
         事件：下拉刷新
         ============================================================ */
      const homeScroll = $('#homeScroll')
      homeScroll.addEventListener('touchstart', (event) => startPull(event.touches[0].clientY), { passive: true })
      homeScroll.addEventListener('touchmove', (event) => {
        if (!pulling) return
        if (event.cancelable && event.touches[0].clientY - pullStartY > 0) event.preventDefault()
        movePull(event.touches[0].clientY)
      }, { passive: false })
      homeScroll.addEventListener('touchend', endPull, { passive: true })
      homeScroll.addEventListener('touchcancel', endPull, { passive: true })
      homeScroll.addEventListener('mousedown', (event) => {
        if (event.button !== 0 || event.target.closest('button')) return
        startPull(event.clientY)
      })
      window.addEventListener('mousemove', (event) => {
        if (!pulling) return
        event.preventDefault()
        movePull(event.clientY)
      })
      window.addEventListener('mouseup', endPull)

      /* ============================================================
         事件：Escape 与焦点循环
         ============================================================ */
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if ($$('.sheet.open').length) { closeSheets(); return }
          if (overlayStack.length) { closeOverlay(); return }
          return
        }
        if (event.key !== 'Tab') return
        const layer = $$('.sheet.open').pop() || topOverlay()
        if (!layer) return
        const focusable = $$(focusableSelector, layer).filter(element => !element.closest('[inert]'))
        if (!focusable.length) { event.preventDefault(); layer.focus({ preventScroll: true }); return }
        const first = focusable[0]
        const last = focusable[focusable.length - 1]
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus({ preventScroll: true }) }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus({ preventScroll: true }) }
      })

      /* ============================================================
         重置与初始化
         ============================================================ */
      function resetPrototype() {
        state.listState = 'normal'
        state.filter = 'unassigned'
        state.form = null
        state.permission = null
        state.detailId = null
        state.lightbox = null
        state.projectSheet = null
        state.deleteTargetId = null
        state.submitPhase = null
        state.submitSourceId = null
        state.submitting = false
        state.refreshing = false
        sources = buildSources()
        closeSheets({ restore: false })
        closeAllOverlays()
        closeKeyboard()
        setPage('home')
        render()
        $('#homeScroll').scrollTop = 0
        showToast('原型状态已重置')
      }

      function init() {
        setPage('home')
        render()
      }

      init()
    })()
  </script>
</body>
</html>
