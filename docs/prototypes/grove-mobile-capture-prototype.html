<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>知林 Grove · 原生移动端「收集」模块探索原型</title>
  <style>
    /* ============================================================
       设计令牌：沿用已确认的对话式 Agent 移动端原型
       docs/prototypes/grove-mobile-agent-prototype.html
       ============================================================ */
    :root {
      color-scheme: light;
      --g-bg: #f7f8f7;
      --g-surface: #ffffff;
      --g-soft: #f1f4f2;
      --g-border: #dde3df;
      --g-ink: #17201c;
      --g-muted: #66716b;
      --g-green: #236748;
      --g-green-soft: #e8f3ed;
      --g-ai: #7251a5;
      --g-ai-soft: #f2edf8;
      --g-confirmed: #187c72;
      --g-confirmed-soft: #e7f5f2;
      --g-risk: #9a6419;
      --g-risk-soft: #fff5df;
      --g-error: #b43c3c;
      --g-error-soft: #fceded;
      --shadow-card: 0 1px 2px rgb(20 40 30 / 4%), 0 2px 8px rgb(20 40 30 / 5%);
      --shadow-pop: 0 18px 50px rgb(16 28 22 / 18%);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --keyboard-height: 270px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #e9eeeb;
      color: var(--g-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      font-weight: 430;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--g-ai); outline-offset: 2px; }
    h1, h2, h3, h4, p, dl, dd, dt { margin: 0; }
    [hidden] { display: none !important; }
    svg.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .caption { font-size: 11px; line-height: 17px; }
    .muted { color: var(--g-muted); }

    /* ---------- 原型外框 ---------- */
    .prototype-stage { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .app {
      position: relative;
      width: min(100%, 390px);
      height: min(844px, calc(100dvh - 48px));
      min-height: 640px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--g-bg);
      border: 1px solid #cfd8d2;
      border-radius: 28px;
      box-shadow: 0 28px 80px rgb(28 49 38 / 18%);
    }

    /* ---------- 原型控制条（正式实现不会出现） ---------- */
    .proto-bar {
      position: relative;
      z-index: 12;
      flex: 0 0 auto;
      display: grid;
      gap: 5px;
      padding: 7px 10px;
      border-bottom: 1px dashed #b7c6bd;
      background: #eef3f0;
    }
    .proto-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; }
    .proto-label { flex: 0 0 auto; color: var(--g-muted); font-size: 10px; font-weight: 650; }
    .proto-chip {
      min-height: 24px;
      padding: 0 7px;
      border: 1px dashed #a9bcb2;
      border-radius: 6px;
      background: var(--g-surface);
      color: var(--g-muted);
      font-size: 10px;
      font-weight: 600;
    }
    .proto-chip[aria-pressed="true"] { border-style: solid; border-color: var(--g-green); background: var(--g-green-soft); color: var(--g-green); }

    /* ---------- 顶栏 ---------- */
    .app-header {
      position: relative;
      z-index: 8;
      flex: 0 0 auto;
      min-height: calc(56px + var(--safe-top));
      padding: calc(8px + var(--safe-top)) 12px 8px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      place-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--g-border);
      background: color-mix(in srgb, var(--g-surface) 94%, transparent);
      backdrop-filter: blur(18px);
    }
    .header-slot { display: grid; place-items: center; width: 100%; }
    .header-slot.start { justify-items: start; }
    .header-slot.end { justify-items: end; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: var(--g-green); color: #fff; font-size: 14px; font-weight: 750; }
    .header-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 16px; font-weight: 700; }
    .header-icon { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 9px; background: transparent; color: var(--g-muted); }
    .header-icon:hover { background: var(--g-soft); color: var(--g-ink); }
    .header-icon.spinning .icon { animation: spin .9s linear infinite; }

    /* ---------- 屏幕与滚动区 ---------- */
    .screens { position: relative; flex: 1; min-height: 0; }
    .screen { position: absolute; inset: 0; display: none; min-height: 0; }
    .screen.active { display: flex; flex-direction: column; }
    .scroll-page { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px calc(96px + var(--safe-bottom)); overscroll-behavior: contain; }
    .screen[data-screen="form"] .scroll-page { padding-bottom: calc(178px + var(--safe-bottom)); }

    /* ---------- 基础排版 ---------- */
    .page-heading { margin-bottom: 14px; }
    .page-heading h1 { font-size: 22px; line-height: 30px; font-weight: 720; }
    .page-heading p { margin-top: 4px; color: var(--g-muted); font-size: 12px; line-height: 19px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 20px 0 8px; }
    .section-title h2 { font-size: 15px; font-weight: 700; }
    .section-title span { color: var(--g-muted); font-size: 10px; text-align: right; }
    .section-title .tone-alert { color: var(--g-error); }

    /* ---------- 状态徽标与标签 ---------- */
    .badge { min-height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 5px; font-size: 10px; font-weight: 650; white-space: nowrap; }
    .badge .icon { width: 13px; height: 13px; stroke-width: 2.1; }
    .badge.waiting { color: var(--g-muted); background: var(--g-soft); border: 1px solid var(--g-border); }
    .badge.processing { color: var(--g-green); background: var(--g-green-soft); }
    .badge.done { color: var(--g-confirmed); background: var(--g-confirmed-soft); }
    .badge.failed { color: var(--g-error); background: var(--g-error-soft); }
    .badge.candidate { color: var(--g-ai); background: var(--g-ai-soft); }
    .badge.neutral { color: var(--g-muted); background: var(--g-soft); }
    .tag { min-height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 5px; font-size: 10px; font-weight: 650; }
    .tag .icon { width: 13px; height: 13px; stroke-width: 2; }
    .tag-unassigned { border: 1px dashed #c3cec8; background: var(--g-bg); color: var(--g-muted); }
    .tag-project { color: var(--g-green); background: var(--g-green-soft); }
    .tag-candidate { color: var(--g-ai); background: var(--g-ai-soft); }
    .tag-confirmed { color: var(--g-confirmed); background: var(--g-confirmed-soft); }
    .spinner { width: 12px; height: 12px; flex: 0 0 auto; border: 1.8px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
    .spinner.lg { width: 22px; height: 22px; border-width: 2.4px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- 按钮 ---------- */
    .button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 13px; border: 1px solid var(--g-border); border-radius: 8px; background: var(--g-surface); font-size: 13px; font-weight: 650; }
    .button:hover { filter: brightness(.985); }
    .button.primary { border-color: var(--g-green); background: var(--g-green); color: #fff; }
    .button.danger { border-color: #efcaca; background: var(--g-error-soft); color: var(--g-error); }
    .button.ghost { border-color: transparent; background: transparent; color: var(--g-muted); }
    .button.block { width: 100%; }
    .button .icon { width: 17px; height: 17px; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .mini-button { min-height: 40px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border: 1px solid var(--g-border); border-radius: 7px; background: var(--g-surface); color: var(--g-ink); font-size: 11.5px; font-weight: 650; }
    .mini-button .icon { width: 15px; height: 15px; }
    .mini-button.danger { border-color: #efcaca; background: var(--g-error-soft); color: var(--g-error); }
    .mini-button[disabled] { opacity: .5; }

    /* ---------- 采集入口 ---------- */
    .entry-row-b { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .entry-tile {
      min-height: 92px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 8px;
      border: 1px solid var(--g-border);
      border-radius: 10px;
      background: var(--g-surface);
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .entry-tile:hover { border-color: #c7d4cc; }
    .entry-tile strong { display: block; font-size: 13px; line-height: 20px; }
    .entry-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: var(--g-green-soft); color: var(--g-green); }

    /* ---------- 列表筛选 ---------- */
    .filter-row { display: inline-flex; align-items: center; gap: 18px; margin: 0 0 2px; }
    .seg { min-height: 28px; display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--g-muted); font-size: 12.5px; font-weight: 600; }
    .seg .icon { width: 13px; height: 13px; }
    .seg[aria-pressed="true"] { color: var(--g-green); border-bottom-color: var(--g-green); }
    .seg .seg-count { color: var(--g-muted); font-size: 10px; font-weight: 600; }
    .seg[aria-pressed="true"] .seg-count { color: var(--g-green); }

    /* ---------- 来源列表 ---------- */
    .list-card { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--g-border); }
    .source-row { display: grid; gap: 8px; padding: 12px 2px; border-bottom: 1px solid var(--g-border); }
    .row-open { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 0; border: 0; background: transparent; text-align: left; }
    .row-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: var(--g-soft); color: var(--g-muted); }
    .row-icon .icon { width: 18px; height: 18px; }
    .row-main { min-width: 0; }
    .row-main strong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; line-height: 19px; }
    .row-meta { display: block; margin-top: 3px; color: var(--g-muted); font-size: 10px; line-height: 15px; }
    .row-error { display: flex; gap: 6px; align-items: flex-start; color: var(--g-error); font-size: 11px; line-height: 17px; overflow-wrap: anywhere; }
    .row-error .icon { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px; }
    .row-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .row-actions { display: flex; align-items: center; gap: 6px; margin-top: 2px; }

    /* ---------- 列表整体状态（空 / 加载失败） ---------- */
    .state-card { display: grid; justify-items: start; gap: 9px; margin-top: 4px; padding: 20px 16px; border: 1px solid var(--g-border); border-radius: 10px; background: var(--g-surface); box-shadow: var(--shadow-card); }
    .state-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--g-green-soft); color: var(--g-green); }
    .state-card h3 { font-size: 15px; line-height: 22px; }
    .state-card p { color: var(--g-muted); font-size: 12px; line-height: 19px; overflow-wrap: anywhere; }
    .state-card.is-error .state-mark { background: var(--g-error-soft); color: var(--g-error); }

    /* ---------- 下拉刷新 ---------- */
    .pull-indicator { position: absolute; top: 0; right: 0; left: 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--g-muted); font-size: 11px; }
    .pull-wrap { position: relative; z-index: 1; background: var(--g-bg); transition: transform .18s ease; }
    .pull-wrap.dragging { transition: none; user-select: none; }

    /* ---------- 采集表单 ---------- */
    .form-section { margin-bottom: 16px; }
    .form-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .form-label strong { font-size: 12.5px; font-weight: 700; }
    .form-label .optional { color: var(--g-muted); font-size: 10px; font-weight: 500; }
    .form-field { width: 100%; display: block; padding: 10px 11px; border: 1px solid var(--g-border); border-radius: 9px; background: var(--g-surface); font-size: 13px; line-height: 20px; }
    textarea.form-field { min-height: 132px; resize: vertical; }
    textarea.form-note { min-height: 76px; }
    .form-field::placeholder { color: var(--g-muted); }
    .field-row { display: grid; grid-template-columns: minmax(0, 1fr) 20px; gap: 8px; align-items: center; min-height: 50px; text-align: left; }
    .field-value { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 13px; font-weight: 650; }
    .field-value .icon { width: 17px; height: 17px; color: var(--g-muted); }
    .field-value .icon.is-project { color: var(--g-green); }
    .field-value span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .field-row > .icon { width: 18px; height: 18px; justify-self: end; color: var(--g-muted); }
    .inline-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 9px; }
    .info-banner { display: flex; gap: 8px; align-items: flex-start; padding: 10px 11px; border: 1px solid var(--g-border); border-radius: 9px; background: var(--g-surface); }
    .info-banner .icon { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 2px; color: var(--g-muted); }
    .info-banner strong { display: block; font-size: 12.5px; line-height: 19px; }
    .info-banner p { margin-top: 3px; color: var(--g-muted); font-size: 11px; line-height: 17px; }
    .info-banner.merged { border-color: #bad5c5; background: var(--g-green-soft); }
    .info-banner.merged .icon { color: var(--g-green); }
    .form-error { display: grid; gap: 4px; margin-bottom: 14px; padding: 11px; border: 1px solid #efcaca; border-left: 3px solid var(--g-error); border-radius: 9px; background: var(--g-error-soft); }
    .form-error strong { display: flex; align-items: center; gap: 6px; color: var(--g-error); font-size: 12.5px; }
    .form-error strong .icon { width: 16px; height: 16px; }
    .form-error p { color: #7d2c2c; font-size: 12px; line-height: 19px; overflow-wrap: anywhere; }
    .form-error .proto-source { color: #8a4a4a; font-size: 10.5px; line-height: 16px; }
    .form-footer { position: absolute; right: 0; bottom: calc(66px + var(--safe-bottom)); left: 0; z-index: 7; display: grid; gap: 7px; padding: 10px 16px 8px; background: linear-gradient(to bottom, transparent, var(--g-bg) 24%, var(--g-bg)); }
    .form-footer-hint { color: var(--g-muted); font-size: 10.5px; line-height: 16px; text-align: center; }
    .proto-panel { display: grid; gap: 6px; margin-bottom: 14px; padding: 9px 10px; border: 1px dashed #b7c6bd; border-radius: 9px; background: #eef3f0; }
    .proto-chips { display: flex; flex-wrap: wrap; gap: 5px; }

    /* ---------- 原始材料示意图 ---------- */
    .photo { position: absolute; inset: 0; background: linear-gradient(160deg, #e6ede9, #cfdcd5); }
    .photo svg { width: 100%; height: 100%; fill: none; stroke: #5d7568; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .photo::after { content: "示意图"; position: absolute; right: 5px; bottom: 4px; padding: 0 4px; border-radius: 3px; background: rgb(255 255 255 / 82%); color: #55635c; font-size: 9px; line-height: 14px; }
    .photo-lg { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--g-border); border-radius: 10px; }
    .photo-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .photo-strip::-webkit-scrollbar { display: none; }
    .thumb { position: relative; flex: 0 0 auto; width: 98px; height: 98px; overflow: hidden; border: 1px solid var(--g-border); border-radius: 9px; }
    .thumb-remove { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: rgb(255 255 255 / 90%); color: var(--g-error); box-shadow: 0 1px 4px rgb(16 28 22 / 20%); }
    .thumb-remove .icon { width: 15px; height: 15px; stroke-width: 2.3; }
    .photo-remove { position: absolute; top: 8px; right: 8px; min-height: 34px; display: inline-flex; align-items: center; gap: 5px; padding: 0 9px; border: 0; border-radius: 8px; background: rgb(255 255 255 / 92%); color: var(--g-error); font-size: 11.5px; font-weight: 650; box-shadow: 0 1px 5px rgb(16 28 22 / 22%); }
    .photo-remove .icon { width: 14px; height: 14px; }

    /* ---------- 权限被拒 ---------- */
    .permission-card { display: grid; justify-items: start; gap: 10px; padding: 20px 16px; border: 1px solid var(--g-border); border-radius: 10px; background: var(--g-surface); box-shadow: var(--shadow-card); }
    .permission-card h2 { font-size: 16px; line-height: 23px; }
    .permission-card p { color: var(--g-muted); font-size: 12.5px; line-height: 20px; }
    .permission-card ul { display: grid; gap: 6px; margin: 2px 0 0; padding-left: 18px; color: var(--g-muted); font-size: 12px; line-height: 19px; }

    /* ---------- 来源详情 ---------- */
    .overlay { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; background: var(--g-bg); }
    .overlay.open { display: flex; }
    .overlay-header { flex: 0 0 auto; min-height: calc(56px + var(--safe-top)); display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; place-items: center; gap: 6px; padding: calc(8px + var(--safe-top)) 10px 8px; border-bottom: 1px solid var(--g-border); background: var(--g-surface); }
    .overlay-header h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 16px; }
    .overlay-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px calc(24px + var(--safe-bottom)); overscroll-behavior: contain; }
    .overlay-footer { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 9px 16px calc(9px + var(--safe-bottom)); border-top: 1px solid var(--g-border); background: var(--g-surface); }
    .detail-card { padding: 14px; border: 1px solid var(--g-border); border-radius: 10px; background: var(--g-surface); box-shadow: var(--shadow-card); }
    .detail-title { margin-top: 9px; font-size: 16.5px; line-height: 24px; font-weight: 700; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .detail-meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 12px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--g-border); font-size: 11.5px; line-height: 18px; }
    .detail-meta dt { color: var(--g-muted); white-space: nowrap; }
    .detail-meta dd { color: var(--g-ink); overflow-wrap: anywhere; }
    .detail-block { margin-top: 18px; }
    .detail-block > h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13.5px; line-height: 20px; }
    .detail-block > h3 span { color: var(--g-muted); font-size: 10px; font-weight: 500; }
    .detail-hint { margin-top: 7px; color: var(--g-muted); font-size: 11.5px; line-height: 18px; overflow-wrap: anywhere; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: 8px; margin-top: 9px; }
    .photo-button { position: relative; aspect-ratio: 1 / 1; overflow: hidden; padding: 0; border: 1px solid var(--g-border); border-radius: 9px; }
    .photo-button .zoom-hint { position: absolute; left: 5px; top: 4px; display: inline-flex; align-items: center; gap: 3px; padding: 0 5px; border-radius: 4px; background: rgb(23 32 28 / 72%); color: #fff; font-size: 9px; line-height: 16px; }
    .photo-button .zoom-hint .icon { width: 11px; height: 11px; stroke-width: 2.2; }
    .text-quote { margin-top: 9px; padding: 12px; border-left: 3px solid var(--g-border); border-radius: 0 8px 8px 0; background: var(--g-bg); font-size: 12.5px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .ocr-block { margin-top: 9px; padding: 12px; border: 1px solid var(--g-border); border-radius: 9px; background: var(--g-surface); font-size: 12.5px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .candidate-card { margin-top: 10px; padding: 12px; border: 1px solid #e2d6f0; border-left: 3px solid var(--g-ai); border-radius: 9px; background: var(--g-surface); }
    .candidate-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .candidate-card h4 { margin-top: 9px; font-size: 13px; line-height: 20px; font-weight: 650; }
    .candidate-line { margin-top: 6px; color: var(--g-muted); font-size: 11.5px; line-height: 18px; overflow-wrap: anywhere; }
    .candidate-line b { color: var(--g-ink); font-weight: 650; }

    /* ---------- 提交状态 ---------- */
    .status-card { display: grid; gap: 10px; padding: 18px 16px; border: 1px solid var(--g-border); border-radius: 12px; background: var(--g-surface); box-shadow: var(--shadow-card); }
    .status-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; background: var(--g-green-soft); color: var(--g-green); }
    .status-mark.warn { background: var(--g-risk-soft); color: var(--g-risk); }
    .status-mark.error { background: var(--g-error-soft); color: var(--g-error); }
    .status-card h2 { font-size: 16px; line-height: 23px; }
    .status-card > p { color: var(--g-muted); font-size: 12.5px; line-height: 20px; }
    .status-facts { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--g-border); color: var(--g-muted); font-size: 11.5px; line-height: 18px; }
    .status-actions { display: grid; gap: 8px; margin-top: 2px; }

    /* ---------- 查看原图 ---------- */
    .overlay-dark { background: #101713; }
    .overlay-dark .overlay-header { border-bottom-color: rgb(255 255 255 / 14%); background: transparent; }
    .overlay-dark .overlay-header h1 { color: #fff; }
    .overlay-dark .header-icon { color: #e3e9e5; }
    .lightbox-frame { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid rgb(255 255 255 / 18%); border-radius: 12px; }
    .lightbox-frame .photo::after { background: rgb(0 0 0 / 55%); color: #fff; }
    .lightbox-caption { margin-top: 10px; color: #c8d2cc; font-size: 11.5px; line-height: 18px; text-align: center; }
    .lightbox-pager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 14px; padding: 4px; border: 1px solid rgb(255 255 255 / 16%); border-radius: 9px; background: rgb(255 255 255 / 6%); }
    .lightbox-pager button { min-height: 40px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: #e3e9e5; font-size: 12px; font-weight: 650; }
    .lightbox-pager button:first-child { justify-self: start; }
    .lightbox-pager button:last-child { justify-self: end; }
    .lightbox-pager span { color: #aab5af; font-size: 11px; font-weight: 650; }

    /* ---------- 底部 Sheet ---------- */
    .scrim { position: absolute; inset: 0; z-index: 29; display: none; background: rgb(15 24 19 / 36%); }
    .scrim.open { display: block; }
    .sheet { position: absolute; right: 0; bottom: 0; left: 0; z-index: 30; display: none; max-height: 86%; overflow: hidden; border-radius: 18px 18px 0 0; background: var(--g-surface); box-shadow: var(--shadow-pop); }
    .sheet.open { display: block; animation: rise .2s ease-out; }
    @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
    .sheet-handle { width: 36px; height: 4px; margin: 8px auto 2px; border-radius: 2px; background: #cad2cd; }
    .sheet-head { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 14px 0; }
    .sheet-head h2 { font-size: 17px; }
    .sheet-close { width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: var(--g-soft); color: var(--g-muted); }
    .sheet-body { max-height: calc(84dvh - 64px); overflow-y: auto; padding: 8px 16px calc(18px + var(--safe-bottom)); }
    .choice-grid { display: grid; gap: 8px; }
    .choice { min-height: 56px; padding: 11px 12px; border: 1px solid var(--g-border); border-radius: 9px; background: var(--g-surface); text-align: left; }
    .choice:hover { border-color: #c7d4cc; }
    .choice strong { display: block; font-size: 13.5px; }
    .choice span { display: block; margin-top: 3px; color: var(--g-muted); font-size: 11px; line-height: 17px; }
    .option-row { width: 100%; min-height: 56px; display: grid; grid-template-columns: 30px minmax(0, 1fr) 22px; gap: 8px; align-items: center; padding: 8px 0; border: 0; border-bottom: 1px solid var(--g-border); background: transparent; text-align: left; }
    .option-row:last-of-type { border-bottom: 0; }
    .option-row strong { display: block; font-size: 13px; }
    .option-row span { display: block; margin-top: 2px; color: var(--g-muted); font-size: 10.5px; }
    .option-row .icon.muted { color: var(--g-muted); }
    .option-row[aria-checked="true"] strong { color: var(--g-green); }
    .option-check { visibility: hidden; color: var(--g-green); }
    .option-row[aria-checked="true"] .option-check { visibility: visible; }
    .option-row[aria-disabled="true"] { opacity: .5; }
    .notice { display: grid; gap: 5px; margin-bottom: 12px; padding: 11px; border: 1px solid #e8d5b0; border-left: 3px solid var(--g-risk); border-radius: 9px; background: var(--g-risk-soft); }
    .notice strong { display: flex; align-items: center; gap: 6px; color: var(--g-risk); font-size: 12.5px; }
    .notice strong .icon { width: 16px; height: 16px; }
    .notice p { color: #76501c; font-size: 11.5px; line-height: 18px; overflow-wrap: anywhere; }
    .notice.is-error { border-color: #efcaca; border-left-color: var(--g-error); background: var(--g-error-soft); }
    .notice.is-error strong { color: var(--g-error); }
    .notice.is-error p { color: #7d2c2c; }
    .sheet-actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; margin-top: 14px; }
    .sheet-actions.single { grid-template-columns: 1fr; }
    .confirm-box { padding: 12px; border: 1px solid var(--g-border); border-radius: 9px; background: var(--g-bg); }
    .confirm-box strong { display: block; font-size: 13.5px; line-height: 20px; }
    .confirm-box p { margin-top: 5px; color: var(--g-muted); font-size: 11.5px; line-height: 18px; overflow-wrap: anywhere; }

    /* ---------- 模拟键盘 ---------- */
    .demo-keyboard {
      position: absolute; right: 0; bottom: 0; left: 0; z-index: 9;
      height: calc(var(--keyboard-height) + var(--safe-bottom)); display: none; padding: 5px 5px calc(7px + var(--safe-bottom));
      background: #d9dfdc; border-top: 1px solid #cbd2ce; color: #25322c; user-select: none;
    }
    .keyboard-open .demo-keyboard { display: block; animation: keyboard-rise .18s ease-out; }
    @keyframes keyboard-rise { from { transform: translateY(24px); } }
    .keyboard-open .bottom-nav { transform: translateY(110%); }
    .keyboard-open .form-footer { bottom: calc(var(--keyboard-height) + var(--safe-bottom)); z-index: 10; }
    .keyboard-open .screen[data-screen="form"] .scroll-page { padding-bottom: calc(var(--keyboard-height) + 130px); }
    .keyboard-toolbar { height: 31px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 0 2px 4px; color: #66716b; }
    .keyboard-toolbar span { text-align: center; font-size: 11px; font-weight: 650; }
    .keyboard-tool { width: 40px; height: 28px; display: grid; place-items: center; justify-self: end; padding: 0; border: 0; border-radius: 7px; background: transparent; color: #5b6861; }
    .keyboard-tool .icon { width: 18px; height: 18px; stroke-width: 1.7; }
    .keyboard-row { height: 43px; display: flex; justify-content: center; gap: 5px; margin-bottom: 7px; }
    .keyboard-row.middle { padding-inline: 14px; }
    .key { min-width: 0; flex: 1; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: #fff; box-shadow: 0 1px 0 #aeb8b2, 0 1px 3px rgb(28 42 35 / 8%); font-size: 17px; font-weight: 520; }
    .key .icon { width: 19px; height: 19px; }
    .key.utility { max-width: 45px; background: #b9c3be; font-size: 13px; }
    .key.space { flex: 4.2; font-size: 13px; }
    .key.action { flex: 1.45; background: var(--g-green); color: #fff; font-size: 13px; font-weight: 680; }
    .key.wide { flex: 1.35; font-size: 12px; font-weight: 650; }

    /* ---------- 底部四栏 ---------- */
    .bottom-nav {
      position: absolute; right: 0; bottom: 0; left: 0; z-index: 8;
      min-height: calc(66px + var(--safe-bottom)); display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 4px 7px var(--safe-bottom);
      border-top: 1px solid var(--g-border); background: color-mix(in srgb, var(--g-surface) 95%, transparent);
      backdrop-filter: blur(18px); transition: transform .18s ease;
    }
    .nav-item { position: relative; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; border: 0; border-radius: 9px; background: transparent; color: var(--g-muted); font-size: 11.5px; }
    .nav-item.active { color: var(--g-green); font-weight: 700; }
    .nav-glyph { width: 38px; height: 29px; display: grid; place-items: center; }
    .nav-glyph .icon { width: 24px; height: 24px; stroke-width: 1.8; }
    .nav-badge { position: absolute; top: 3px; left: calc(50% + 8px); min-width: 16px; height: 16px; display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--g-surface); border-radius: 8px; background: var(--g-ai); color: #fff; font-size: 8px; }

    /* ---------- Toast ---------- */
    .toast { position: absolute; right: 14px; bottom: calc(78px + var(--safe-bottom)); left: 14px; z-index: 50; padding: 11px 12px; border-radius: 9px; background: #26342d; color: #fff; box-shadow: var(--shadow-pop); opacity: 0; transform: translateY(8px); pointer-events: none; transition: .18s ease; font-size: 12px; line-height: 18px; text-align: center; }
    .toast.show { opacity: 1; transform: translateY(0); }
    /* 表单页与键盘态下，提示条让开固定的提交区 */
    .app[data-page="form"]:not(.keyboard-open) .toast { bottom: calc(170px + var(--safe-bottom)); }
    .keyboard-open .toast { bottom: calc(var(--keyboard-height) + 96px + var(--safe-bottom)); }

    /* ---------- 视口适配 ---------- */
    @media (max-width: 430px) {
      .prototype-stage { padding: 0; display: block; }
      .app { width: 100%; height: 100dvh; min-height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
    }
    @media (max-width: 370px) {
      .scroll-page, .overlay-scroll { padding-right: 13px; padding-left: 13px; }
      .entry-tile { min-height: 88px; padding: 11px; }
      .thumb { width: 88px; height: 88px; }
      .row-open { grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; }
      .row-icon { width: 30px; height: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>

  <script>
    (function () {
      'use strict'

      /* ============================================================

      const $ = (selector, root = document) => root.querySelector(selector)

      const icon = (name, style = '') => `<svg class="icon"${style ? ` style="${style}"` : ''} aria-hidden="true"><use href="#i-${name}"/></svg>`
      const iconClass = (name, className) => `<svg class="icon ${className}" aria-hidden="true"><use href="#i-${name}"/></svg>`
      const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms))
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
      const clone = (value) => JSON.parse(JSON.stringify(value))

      const app = $('#app')
      const toastEl = $('#toast')
      const scrim = $('#scrim')
      const PULL_THRESHOLD = 56

      /* ============================================================

      const projectName = (id) => PROJECTS.find(item => item.id === id)?.name || ''

      const SCENES = {

        water: '<rect x="22" y="14" width="116" height="92" rx="4"/><path d="M22 74h116"/><path d="M22 56c8-6 16 6 24 0s16 6 24 0 16 6 24 0 16 6 24 0 12 4 20 1"/><path d="M126 30v44M122 34h8M122 44h8M122 54h8M122 64h8"/>',

      const FORM_TITLES = { camera: '拍照采集', 'album-separate': '图片采集', 'album-merged': '图片采集', text: '文字采集' }

      /* ============================================================

      const state = {
        listState: 'normal',
        filter: 'unassigned',
        page: 'home',
        previousPage: 'home',
        form: null,
        permission: null,
        detailId: null,
        lightbox: null,

        deleteTargetId: null,

        submitSourceId: null,
        submitting: false,
        refreshing: false,
        activeField: null,
      }
      let sources = buildSources()
      let sheetTrigger = null
      const overlayStack = []
      let toastTimer = null
      let keyboardTimer = null

      function buildSources() {
        return [
          {
            id: 's1', kind: 'image', title: '防水验收现场照片',
            attachments: [
              { scene: 'wall', label: '卫生间墙面涂刷范围' },
              { scene: 'pipe', label: '管根加强层' },
              { scene: 'water', label: '闭水水位标记' },
              { scene: 'note', label: '现场验收记录' },
            ],
            note: '监理陪同下拍摄，包含墙面涂刷范围、管根加强层与闭水水位',
            text: '', projectId: null, status: 'processing', pending: 0, evidence: 0,
            createdAt: '今天 10:12', failReason: null, retryCount: 0, locked: false,
            ocr: '', candidates: [], pollSteps: null, moving: false,
          },
          {

            ocr: '', candidates: [], pollSteps: null, moving: false,
          },
          {

            attachments: [{ scene: 'pipe', label: '地漏周边补刷范围' }],
            note: '补刷完成，等干燥后进入下一道工序', text: '',
            projectId: 'p1', status: 'done', pending: 3, evidence: 0,
            createdAt: '昨天 18:05', failReason: null, retryCount: 0, locked: false,
            ocr: '地漏周边 300mm 范围内完成补刷；补刷时间 9 月 21 日 16:20。',
            candidates: [
              { content: '地漏周边补刷范围不小于 300mm', path: '新房装修 / 施工 / 防水', reason: '来源 OCR 明确写了 300mm 补刷范围' },
              { content: '补刷完成并干燥后再进入下一道工序', path: '新房装修 / 施工 / 工序衔接', reason: '来源只记录了补刷时间，没有后续工序的开始时间' },
              { content: '门槛石内侧与地漏周边属于易渗漏位置，需要逐项检查', path: '新房装修 / 验收 / 易渗漏位置', reason: '同一批采集的其他照片也覆盖了这些位置' },
            ],
            pollSteps: null, moving: false,
          },
          {
            id: 's4', kind: 'image', title: '闭水试验水位记录',
            attachments: [
              { scene: 'water', label: '闭水开始时的水位' },
              { scene: 'water', label: '24 小时复查水位' },
              { scene: 'note', label: '复查记录' },
            ],
            note: '闭水开始与 24 小时复查各拍一次', text: '',
